name: Release (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 1.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: Undertone
  VERSION: ${{ inputs.version }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate version and make sure the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Version '$env:VERSION' is not valid. Use a form like 1.3.0 (no leading v)."
            exit 1
          }
          $tag = "v$env:VERSION"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { Write-Error "Could not read tags from GitHub."; exit 1 }
          if ($existing) {
            Write-Error "Tag $tag already exists. Choose a new version number; nothing was built or released."
            exit 1
          }
          Write-Host "Releasing $tag"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Build Windows native helper
        run: npm run build:native

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --no-install electron-builder --win nsis --x64 --publish never "-c.extraMetadata.version=$env:VERSION"

      - name: Check installer and update files
        run: |
          $setup = "release/$env:APP_NAME-Setup-$env:VERSION.exe"
          $files = @($setup, "$setup.blockmap", "release/latest.yml")
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { Write-Error "Expected build output not found: $f"; exit 1 }
          }
          $latest = Get-Content release/latest.yml -Raw
          if ($latest -notmatch "version: $([regex]::Escape($env:VERSION))") { Write-Error "latest.yml does not describe version $env:VERSION"; exit 1 }

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "release/$env:APP_NAME-Setup-$env:VERSION.exe"
          gh release create "v$env:VERSION" $setup "$setup.blockmap" release/latest.yml `
            --target "$env:GITHUB_SHA" `
            --title "$env:APP_NAME v$env:VERSION" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { Write-Error "Creating the release failed."; exit 1 }
