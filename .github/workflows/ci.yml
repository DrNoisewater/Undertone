name: CI (Windows)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Build Windows native helper
        run: npm run build:native

      - name: Package app (smoke test, not published)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx --no-install electron-builder --win dir --x64 --publish never
          if (-not (Test-Path "release/win-unpacked/Undertone.exe")) { Write-Error "Packaged app missing."; exit 1 }

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: Undertone-PR${{ github.event.pull_request.number }}
          path: release/win-unpacked/
          retention-days: 14
          if-no-files-found: error
